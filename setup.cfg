[flake8]
max-line-length = 88
exclude = 
    .git,
    __pycache__,
    migrations,
    venv,
    env,
    .venv,
    .env,
    node_modules,
    .pytest_cache,
    htmlcov,
    build,
    dist,
    *.egg-info
ignore = 
    E203,
    E501,
    W503,
    F401
per-file-ignores =
    __init__.py:F401
    settings.py:E501
    */migrations/*:E501,F401
max-complexity = 10
count = True
statistics = True
show-source = True

[coverage:run]
source = .
omit = 
    */venv/*
    */env/*
    */migrations/*
    */tests/*
    */test_*
    manage.py
    */conftest.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
show_missing = True
skip_covered = False
precision = 2

[coverage:html]
directory = htmlcov
title = Django Bitcoin Tracker Coverage Report

[coverage:xml]
output = coverage.xml