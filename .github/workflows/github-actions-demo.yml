name: Django CI/CD Pipeline
run-name: ${{ github.actor }} is running Django tests and deployment 🚀

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # This adds the manual "Run workflow" button

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install pipenv
      run: |
        python -m pip install --upgrade pip
        python -m pip install pipenv
    
    - name: Cache pipenv dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pipenv
        key: ${{ runner.os }}-pipenv-${{ hashFiles('**/Pipfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pipenv-
    
    - name: Install dependencies
      run: |
        python -m pipenv install --dev
    
    - name: Run Django system checks
      run: |
        python -m pipenv run python manage.py check
    
    - name: Run Django migrations check
      run: |
        python -m pipenv run python manage.py makemigrations --check --dry-run
    
    - name: Run Django built-in tests
      run: |
        python -m pipenv run python manage.py test --verbosity=2
    
    - name: Run pytest with coverage
      run: |
        python -m pipenv run pytest --cov=. --cov-report=xml --cov-report=html --cov-report=term-missing -v
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Archive coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: htmlcov/
    
    - name: Run security checks
      run: |
        python -m pipenv run python manage.py check --deploy
      continue-on-error: true
    
    - name: Test collectstatic
      run: |
        python -m pipenv run python manage.py collectstatic --noinput --dry-run
      continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install pipenv and linting tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install pipenv flake8 black isort
    
    - name: Install dependencies
      run: |
        python -m pipenv install --dev
    
    - name: Run flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Check code formatting with black
      run: |
        black --check --diff .
      continue-on-error: true
    
    - name: Check import sorting with isort
      run: |
        isort --check-only --diff .
      continue-on-error: true

  integration-test:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install pipenv
      run: |
        python -m pip install --upgrade pip
        python -m pip install pipenv
    
    - name: Install dependencies
      run: |
        python -m pipenv install --dev
    
    - name: Run database migrations
      run: |
        python -m pipenv run python manage.py migrate
    
    - name: Run integration tests
      run: |
        python -m pipenv run pytest -m integration -v
    
    - name: Run performance tests
      run: |
        python -m pipenv run pytest -m slow -v
      continue-on-error: true
    
    - name: Test server startup
      run: |
        python -m pipenv run python manage.py runserver --noreload &
        sleep 10
        pkill -f "python.*manage.py runserver" || true
      continue-on-error: true

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install pipenv and security tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install pipenv safety bandit
    
    - name: Install dependencies
      run: |
        python -m pipenv install --dev
    
    - name: Run safety check for known vulnerabilities
      run: |
        python -m pipenv run safety check
      continue-on-error: true
    
    - name: Run bandit security linter
      run: |
        bandit -r . -f json -o bandit-report.json
      continue-on-error: true
    
    - name: Upload security scan results
      uses: actions/upload-artifact@v3
      with:
        name: security-scan-results
        path: bandit-report.json
      if: always()

  build-summary:
    runs-on: ubuntu-latest
    needs: [test, lint, integration-test, security-scan]
    if: always()
    
    steps:
    - name: Build Summary
      run: |
        echo "🎉 Build completed!"
        echo "✅ Tests: ${{ needs.test.result }}"
        echo "✅ Linting: ${{ needs.lint.result }}"
        echo "✅ Integration Tests: ${{ needs.integration-test.result }}"
        echo "✅ Security Scan: ${{ needs.security-scan.result }}"
